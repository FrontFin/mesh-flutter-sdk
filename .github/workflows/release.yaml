# Runs on pushes to main. Validates the version bump, runs CI, then creates and pushes the git tag.
# Pushing the tag triggers publish.yaml, which runs with refType=tag — required by pub.dev OIDC trusted publishing.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      new_version: ${{ steps.version_check.outputs.new_version }}
      version: ${{ steps.version_check.outputs.version }}

    steps:
      - name: Checkout 🎾
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if new version & bump type 🔍📊
        id: version_check
        run: |
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+$'

          normalize_semver() {
            local s="$1"
            s="${s//\"/}"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            s="${s#v}"
            echo "$s"
          }

          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=$(normalize_semver "$VERSION")
          LATEST_RAW_TAG=$(git tag --sort=-v:refname | head -n 1)
          LATEST_TAG=$(normalize_semver "$LATEST_RAW_TAG")

          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::version in pubspec.yaml must be MAJOR.MINOR.PATCH; got: ${VERSION:-<empty>}"
            exit 1
          fi
          if [[ -n "$LATEST_TAG" && ! "$LATEST_TAG" =~ $SEMVER_RE ]]; then
            echo "::error::Latest git tag must be MAJOR.MINOR.PATCH or unset; fix tag: $LATEST_RAW_TAG"
            exit 1
          fi

          semver_gt() {
            IFS='.' read -r A_MAJOR A_MINOR A_PATCH <<< "$1"
            IFS='.' read -r B_MAJOR B_MINOR B_PATCH <<< "$2"
            if [[ "$A_MAJOR" -gt "$B_MAJOR" ]]; then return 0; fi
            if [[ "$A_MAJOR" -eq "$B_MAJOR" && "$A_MINOR" -gt "$B_MINOR" ]]; then return 0; fi
            if [[ "$A_MAJOR" -eq "$B_MAJOR" && "$A_MINOR" -eq "$B_MINOR" && "$A_PATCH" -gt "$B_PATCH" ]]; then return 0; fi
            return 1
          }

          echo "Current version in pubspec.yaml: $VERSION"
          echo "Latest git tag: ${LATEST_TAG:-<none>}"

          if [[ "$VERSION" == "$LATEST_TAG" ]]; then
            echo "No new version detected — skipping release"
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$LATEST_TAG" ]] && ! semver_gt "$VERSION" "$LATEST_TAG"; then
            echo "::error::version in pubspec.yaml ($VERSION) is not greater than the latest tag ($LATEST_TAG) — accidental downgrade?"
            exit 1
          elif [[ -n "$(git tag -l "v$VERSION")" ]]; then
            echo "::error::Tag v$VERSION already exists — bump the version in pubspec.yaml before releasing"
            exit 1
          else
            echo "New version detected: $VERSION (previous: ${LATEST_TAG:-<none>})"
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changelog 📋
        if: steps.version_check.outputs.new_version == 'true'
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::Missing CHANGELOG.md file."
            exit 1
          fi
          if ! grep -Fq "## ${VERSION}" CHANGELOG.md; then
            echo "::error::No changelog entry found for version ${VERSION} in CHANGELOG.md"
            exit 1
          fi
          echo "Changelog entry for ${VERSION} found ✓"

  ci:
    needs: check-version
    if: needs.check-version.outputs.new_version == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout 🎾
        uses: actions/checkout@v6

      - name: Set up Flutter 🐦
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies 📦
        run: flutter pub get

      - name: Verify formatting 🧹
        run: dart format -o none --set-exit-if-changed .

      - name: Analyze project source 🩺
        run: flutter analyze

      - name: Run tests ⚛️
        run: flutter test --coverage

  create-tag:
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 🎾
        uses: actions/checkout@v6
        with:
          # Must use a PAT (not GITHUB_TOKEN) so the tag push is treated as a real actor event
          # and triggers the publish.yaml workflow. GITHUB_TOKEN-pushed events are suppressed
          # by GitHub to prevent workflow loops.
          # Passing the token here lets actions/checkout install a credential helper that
          # supplies it at the HTTP layer — the token never appears in the remote URL.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Create and push git tag 🏷️
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"
